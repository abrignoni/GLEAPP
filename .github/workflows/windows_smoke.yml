name: Windows Smoke Test

# GLEAPP is built and shipped for Windows: packaging/ carries a PyInstaller spec, an
# Inno Setup installer, and a WebView2-backed desktop shell. Development and the other
# CI jobs run on Linux, so without this job the platform the tool actually ships on is
# the one platform nothing tests.
#
# Two steps, in increasing strength. The import sweep catches breakage at import time:
# a module reaching for a POSIX-only name, or a conditional import that resolves on one
# OS and not the other. The test suite then catches behaviour, which is where the real
# Windows differences live. Path separators, case-insensitive filesystems and text
# encoding all pass on Linux and can still be wrong here, and reading a file with the
# wrong encoding is the kind of defect that returns bad data rather than an error.
#
# --prefer-binary matters here. pyliblzfse publishes a Windows wheel but no Linux one,
# and the runner has no C toolchain configured by default, so preferring wheels keeps
# this job from failing on a source build rather than on GLEAPP's own code.

on:
  pull_request:
    paths:
      - 'gleapp/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/windows_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
          python -m pip install --prefer-binary pytest piexif

      - name: Import every gleapp module on Windows
        run: python tools/ci_import_smoke.py

      - name: Run test suite on Windows
        run: python -m pytest tests -v
