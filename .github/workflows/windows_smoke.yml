name: Windows Smoke Test

# GLEAPP is built and shipped for Windows: packaging/ carries a PyInstaller spec, an
# Inno Setup installer, and a WebView2-backed desktop shell. Development and the other
# CI jobs run on Linux, so without this job the platform the tool actually ships on is
# the one platform nothing tests.
#
# Two steps, in increasing strength. The import sweep catches breakage at import time:
# a module reaching for a POSIX-only name, or a conditional import that resolves on one
# OS and not the other. The test suite then catches behaviour, which is where the real
# Windows differences live. Path separators, case-insensitive filesystems and text
# encoding all pass on Linux and can still be wrong here, and reading a file with the
# wrong encoding is the kind of defect that returns bad data rather than an error.
#
# --prefer-binary matters here. pyliblzfse publishes a Windows wheel but no Linux one,
# and the runner has no C toolchain configured by default, so preferring wheels keeps
# this job from failing on a source build rather than on GLEAPP's own code.

# The pull_request trigger deliberately carries no paths: filter. These checks are
# required for merging, and a required check that never runs never reports, which
# blocks the pull request permanently rather than passing it. Path filtering and
# required status are incompatible; the filter stays only on the advisory lint job.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
          # the dev extra, not a second hand-written list: it carries pytest, piexif
          # and pillow-heif, whose encoder writes the HEIC test fixture that pi-heif
          # cannot. Nothing here reaches a build.
          python -m pip install --prefer-binary -e ".[dev]"

      # hashstore shells out to the sqlite3 CLI to apply an NSRL delta, and that is
      # the one external binary GLEAPP needs. Windows does not ship it, so
      # test_build_db_and_apply_delta skipped here while running everywhere else,
      # leaving the only code path with an outside dependency unexercised on the
      # platform GLEAPP ships on.
      - name: Install the sqlite3 CLI
        run: |
          choco install sqlite --no-progress -y
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      # A skipped test still reports green, so an install that lands somewhere off
      # PATH would quietly restore the skip and look identical to success. Assert
      # through the same shutil.which call the test itself guards on.
      - name: Confirm sqlite3 reached PATH
        run: |
          python -c "import shutil, sys; p = shutil.which('sqlite3'); print('sqlite3 ->', p); sys.exit(0 if p else 1)"

      - name: Import every gleapp module on Windows
        run: python tools/ci_import_smoke.py

      - name: Run test suite on Windows
        run: python -m pytest tests -v

      # The desktop window is pywebview over Edge WebView2. requirements.txt installs
      # pywebview and pythonnet; the runner image ships Edge but not the WebView2
      # runtime, so it goes on here, the way pywebview's own CI installs it.
      - name: Install the WebView2 runtime
        run: choco install webview2-runtime --no-progress -y

      # Opens the real window on the runner's desktop session, waits for the launcher
      # to load, reads its title through the webview, and closes it. That is what a
      # user gets from `python gleappGUI.py` after `pip install -r requirements.txt`:
      # the pywebview import, pythonnet loading .NET, the WebView2 control, and Flask
      # serving the page into it. Exit status 1 if any of that did not happen, and the
      # step's own timeout if the window opens and never loads.
      - name: Open the desktop window and close it
        env:
          GLEAPP_DESKTOP_SMOKE: "1"
        timeout-minutes: 5
        run: python gleappGUI.py
