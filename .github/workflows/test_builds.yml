name: Test builds

# Builds the frozen desktop executable on each platform with packaging/build.py and
# smoke-tests what came out, headlessly: --version must print the package version, and
# --texworker must decode an image inside the frozen bundle. The Windows leg goes on to
# build the Inno Setup installer and the macOS leg the .dmg, so phase 2 and the version
# pass-through are exercised somewhere real on both. Artifacts are uploaded for inspection; nothing here is a release.
#
# Advisory rather than required, so a paths filter is fine here. Modeled on iLEAPP's
# test_builds.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - 'gleapp/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/test_builds.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[build]"

      - name: Phase 1, the executable
        shell: bash
        run: python packaging/build.py exe

      # Neither check opens a window. --version is answered by packaging/entrypoint.py
      # before the desktop shell is imported; --texworker is the isolated decoder the app
      # itself re-invokes, and it exercises Pillow and the texture decoders inside the
      # frozen bundle on a real file.
      - name: Smoke test the frozen binary, headless
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/GLEAPP/GLEAPP.exe; else BIN=dist/GLEAPP/GLEAPP; fi
          WANT="GLEAPP $(python -c "import sys; sys.path.insert(0, 'packaging'); import build; print(build.read_version())")"
          GOT="$("$BIN" --version)"
          echo "--version -> '$GOT'"
          [ "$GOT" = "$WANT" ] || { echo "expected '$WANT'"; exit 1; }
          python -c 'from PIL import Image; Image.new("RGB", (64, 48), (30, 120, 200)).save("smoke_in.png")'
          "$BIN" --texworker smoke_in.png smoke_out.jpg 32
          [ -s smoke_out.jpg ] || { echo "--texworker produced no output"; exit 1; }
          echo "--texworker -> $(wc -c < smoke_out.jpg) bytes"
          if [ "$RUNNER_OS" = "macOS" ]; then
            APPBIN=dist/GLEAPP.app/Contents/MacOS/GLEAPP
            [ -x "$APPBIN" ] || { echo "no .app bundle produced"; exit 1; }
            echo "bundle --version -> $("$APPBIN" --version)"
            /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" dist/GLEAPP.app/Contents/Info.plist
          fi

      - name: Phase 2, the disk image (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/build.py installer
          ls -l dist/GLEAPP-*.dmg

      - name: Phase 2, the installer (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup --no-progress -y
          python packaging/build.py installer
          ls -l dist/GLEAPP-Setup-*.exe

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: gleapp-${{ matrix.os }}-test
          path: |
            dist/GLEAPP/
            dist/GLEAPP-Setup-*.exe
            dist/GLEAPP.app/
            dist/GLEAPP-*.dmg
          if-no-files-found: error
