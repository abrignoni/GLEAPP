name: Test builds

# Builds the frozen desktop executable on each platform with packaging/build.py and
# smoke-tests what came out, headlessly: --version must print the package version, and
# --texworker must decode an image inside the frozen bundle. The Windows leg goes on to
# build the Inno Setup installer and the macOS leg the .dmg, so phase 2 and the version
# pass-through are exercised somewhere real on both. Artifacts are uploaded for inspection; nothing here is a release.
#
# Advisory rather than required, so a paths filter is fine here, and it deliberately
# leaves gleapp/** out: a logic change inside an existing module almost never breaks the
# frozen build, and the three legs together bill about 35 minutes per run while the repo
# is private. Packaging and dependency changes are where frozen-build breaks come from,
# and the weekly schedule covers the rest. Modeled on iLEAPP's test_builds.yml, which
# is manual only.

on:
  workflow_dispatch:
  # A weekly build of main catches a frozen-build break that ordinary code introduces,
  # a new import PyInstaller cannot see, without paying three PyInstaller runs on every
  # pull request. Monday 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'packaging/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/test_builds.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # macOS only. The opencv-python-headless wheels for macOS vendor a Homebrew
      # FFmpeg built --enable-gpl, so they carry x264, x265, xvid, rubberband, vidstab
      # and frei0r, and cv2 hard-links the FFmpeg stack, so those cannot be stripped.
      # GLEAPP cannot ship GPL code, because the bundle also holds Apache-1.1 code and
      # Microsoft's WebView2 redistributables, and packaging/gleapp.spec refuses such a
      # build. conda-forge publishes an LGPL FFmpeg, so macOS takes OpenCV from there.
      # Its package registers opencv_python_headless dist-info, so the pip step below
      # sees the requirement satisfied and does not pull the wheel back in.
      # See "macOS: take OpenCV from conda-forge" in the README.
      - name: macOS, OpenCV from conda-forge
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -sL "https://micro.mamba.pm/api/micromamba/osx-$(uname -m | sed s/x86_64/64/)/latest" \
            | tar -xj bin/micromamba
          ./bin/micromamba create -y -p ./build-env -c conda-forge --no-rc \
            python=3.12 "py-opencv=*=headless*" "ffmpeg=*=lgpl*"
          echo "$PWD/build-env/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[build]"
          python -c "import cv2; print('cv2', cv2.__version__, cv2.__file__)"

      - name: Phase 1, the executable
        shell: bash
        run: python packaging/build.py exe

      # Neither check opens a window. --version is answered by packaging/entrypoint.py
      # before the desktop shell is imported; --texworker is the isolated decoder the app
      # itself re-invokes, and it exercises Pillow and the texture decoders inside the
      # frozen bundle on a real file.
      - name: Smoke test the frozen binary, headless
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/GLEAPP/GLEAPP.exe; else BIN=dist/GLEAPP/GLEAPP; fi
          WANT="GLEAPP $(python -c "import sys; sys.path.insert(0, 'packaging'); import build; print(build.read_version())")"
          GOT="$("$BIN" --version)"
          echo "--version -> '$GOT'"
          [ "$GOT" = "$WANT" ] || { echo "expected '$WANT'"; exit 1; }
          python -c 'from PIL import Image; Image.new("RGB", (64, 48), (30, 120, 200)).save("smoke_in.png")'
          "$BIN" --texworker smoke_in.png smoke_out.jpg 32
          [ -s smoke_out.jpg ] || { echo "--texworker produced no output"; exit 1; }
          echo "--texworker -> $(wc -c < smoke_out.jpg) bytes"
          if [ "$RUNNER_OS" = "macOS" ]; then
            APPBIN=dist/GLEAPP.app/Contents/MacOS/GLEAPP
            [ -x "$APPBIN" ] || { echo "no .app bundle produced"; exit 1; }
            echo "bundle --version -> $("$APPBIN" --version)"
            /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" dist/GLEAPP.app/Contents/Info.plist
          fi

      - name: Phase 2, the disk image (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/build.py installer
          ls -l dist/GLEAPP-*.dmg

      - name: Phase 2, the installer (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup --no-progress -y
          python packaging/build.py installer
          ls -l dist/GLEAPP-Setup-*.exe

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: gleapp-${{ matrix.os }}-test
          path: |
            dist/GLEAPP/
            dist/GLEAPP-Setup-*.exe
            dist/GLEAPP.app/
            dist/GLEAPP-*.dmg
          if-no-files-found: error
