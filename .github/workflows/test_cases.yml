name: Test Cases

# Runs the pytest suite under tests/. This is the baseline job: it answers "does the
# code still do what the tests say it does" on the platform most development happens
# on. Platform coverage is windows_smoke.yml's job and version coverage is
# python_runtime_contract.yml's; neither replaces this one.

# The pull_request trigger deliberately carries no paths: filter. These checks are
# required for merging, and a required check that never runs never reports, which
# blocks the pull request permanently rather than passing it. Path filtering and
# required status are incompatible; the filter stays only on the advisory lint job.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'gleapp/**'
      - 'tests/**'
      - 'tools/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/test_cases.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This job is required and has no paths filter, so it runs on every pull request;
      # the lint job only runs on Python changes and a CRLF README would walk past it.
      - name: Every tracked text file is LF
        run: bash tools/check_line_endings.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Every job installs the package editable, this one included, and an editable
      # install reads the checkout, so a package-data pattern in pyproject.toml that
      # misses a file leaves the wheel short and nothing notices. This builds the wheel
      # from HEAD and compares it with the tracked files under gleapp/. It needs pip
      # and nothing from requirements.txt.
      - name: The wheel carries every tracked file under gleapp/
        run: python tools/check_wheel.py

      # pyliblzfse publishes no Linux wheel, so pip builds it from source here. That
      # needs nothing beyond the compiler the runner already has, but it is the reason
      # this step is slower than the requirements list suggests.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # the dev extra, not a second hand-written list: it carries pytest, piexif and
          # pillow-heif, and the HEIC test fixture is written with pillow-heif's encoder,
          # which pi-heif leaves out. Nothing here reaches a build; packaging/gleapp.spec
          # excludes pillow_heif and refuses any build that bundles a GPL codec.
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests -v
