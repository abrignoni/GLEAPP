[build-system]
# setuptools 77 is the first to take `license` as an SPDX string and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gleapp-forensics"
version = "0.1.0"
description = "GLEAPP - Graphics · Logs · Examination · Automated Processing · Parsing: an open-source image/video forensic triage toolkit"
readme = "README.md"
requires-python = ">=3.10"
# The licence of the whole wheel, what it bundles included: GLEAPP, the vendored
# readers and the YuNet model are MIT, Impacket's ESE code Apache 1.1, the SFace model
# Apache 2.0, the map code BSD-3-Clause with some MIT parts, the map style design CC0
# and the map glyphs OFL 1.1. tests/test_licence_metadata.py ties both fields to the
# licence texts themselves.
license = "MIT AND Apache-1.1 AND Apache-2.0 AND BSD-3-Clause AND OFL-1.1 AND CC0-1.0"
# Every licence text the wheel ships. Naming them also keeps setuptools' default
# patterns from taking the NOTICES.txt that tools/make_notices.py writes at the repo root.
license-files = [
    "LICENSE",
    "gleapp/vendor/LICENSE-*",
    "gleapp/models/LICENSE-*",
    "gleapp/web/static/maps/LICENSE-*",
    "gleapp/web/static/maps/fonts/OFL.txt",
]
authors = [{ name = "charpy4n6" }]
dependencies = [
    "Pillow>=10.2",
    "pi-heif>=1.4",
    "texture2ddecoder>=1.0",
    "pyliblzfse>=0.4.1",
    "zstandard>=0.22",
    "py7zr>=0.21",
    "imagehash>=4.3",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Flask>=3.0",
    "tzdata>=2024.1",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "piexif>=1.1", "pillow-heif>=1.0"]
desktop = ["pywebview>=5.0"]
build = ["pywebview>=5.0", "pyinstaller==6.22.2"]

[project.scripts]
gleapp = "gleapp.cli:main"
gleapp-desktop = "gleapp.desktop:main"

[tool.setuptools.packages.find]
include = ["gleapp*"]

# Paths are relative to gleapp/. Every tracked file under gleapp/ belongs in the
# wheel: tools/check_wheel.py builds one in CI and fails if any is left out.
[tool.setuptools.package-data]
gleapp = [
    "web/templates/**/*",
    "web/static/**/*",
    "models/**/*",
    "vendor/LICENSE-*",
    "vendor/vendored.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
